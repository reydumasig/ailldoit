steps:
  # Step 1: Log in to Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "--- Validating Docker Hub secrets ---"
        if [ -n "$$DOCKER_HUB_USERNAME" ] && [ -n "$$DOCKER_HUB_PASSWORD" ]; then 
          echo "✅ Docker Hub credentials found."; 
        else 
          echo "❌ Docker Hub credentials NOT found."; 
          exit 1; 
        fi
        echo "--- Attempting Docker Hub login ---"
        echo "$$DOCKER_HUB_PASSWORD" | docker login --username "$$DOCKER_HUB_USERNAME" --password-stdin
    secretEnv: ['DOCKER_HUB_USERNAME', 'DOCKER_HUB_PASSWORD']
    id: 'docker-login'

  # Step 2: Build the Docker image with secrets
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    waitFor: ['docker-login']
    args:
      - '-c'
      - |
        echo "--- Validating secret in Cloud Build ---"
        echo "VITE_STRIPE_PUBLIC_KEY starts with: ${VITE_STRIPE_PUBLIC_KEY:0:10}..."
        docker build -t "${_IMAGE_NAME}" \
          --build-arg VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
          --build-arg VITE_FIREBASE_PROJECT_ID=$$VITE_FIREBASE_PROJECT_ID \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
          --build-arg VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
          --build-arg VITE_STRIPE_PUBLIC_KEY=$$VITE_STRIPE_PUBLIC_KEY \
          --build-arg VITE_STRIPE_STARTER_PRICE_ID=$$VITE_STRIPE_STARTER_PRICE_ID \
          --build-arg VITE_STRIPE_GROWTH_PRICE_ID=$$VITE_STRIPE_GROWTH_PRICE_ID \
          .
    id: 'docker-build'
    secretEnv:
      - 'VITE_FIREBASE_API_KEY'
      - 'VITE_FIREBASE_AUTH_DOMAIN'
      - 'VITE_FIREBASE_PROJECT_ID'
      - 'VITE_FIREBASE_STORAGE_BUCKET'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID'
      - 'VITE_FIREBASE_APP_ID'
      - 'VITE_STRIPE_PUBLIC_KEY'
      - 'VITE_STRIPE_STARTER_PRICE_ID'
      - 'VITE_STRIPE_GROWTH_PRICE_ID'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}']
    id: 'push-image'
    waitFor: ['docker-build']

  # ✅ Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ailldoit-feature/long-video-veo-3.1
      - --image=${_IMAGE_NAME}
      - --region=us-central1
      - --platform=managed
      - --quiet
    id: 'deploy'
    waitFor: ['push-image']

# Push image output
images:
  - '${_IMAGE_NAME}'

# Secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: 'VITE_FIREBASE_API_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: 'VITE_FIREBASE_AUTH_DOMAIN'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_PROJECT_ID/versions/latest
      env: 'VITE_FIREBASE_PROJECT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: 'VITE_FIREBASE_STORAGE_BUCKET'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: 'VITE_FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: 'VITE_FIREBASE_APP_ID'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_STRIPE_PUBLIC_KEY/versions/latest
      env: 'VITE_STRIPE_PUBLIC_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_STRIPE_STARTER_PRICE_ID/versions/latest
      env: 'VITE_STRIPE_STARTER_PRICE_ID'
    - versionName: projects/${PROJECT_ID}/secrets/VITE_STRIPE_GROWTH_PRICE_ID/versions/latest
      env: 'VITE_STRIPE_GROWTH_PRICE_ID'
    - versionName: projects/${PROJECT_ID}/secrets/DOCKER_HUB_USERNAME/versions/latest
      env: 'DOCKER_HUB_USERNAME'
    - versionName: projects/${PROJECT_ID}/secrets/DOCKER_HUB_PASSWORD/versions/latest
      env: 'DOCKER_HUB_PASSWORD'

substitutions:
  _IMAGE_NAME: "us-central1-docker.pkg.dev/ailldoit-6d0e0/cloud-run-source-deploy/ailldoit-feature/long-video-veo-3.1/ailldoit-feature/long-video-veo-3.1:${COMMIT_SHA}"

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
